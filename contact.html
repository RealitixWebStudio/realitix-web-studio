<form action="https://formsubmit.co/rrealitix@gmail.com" method="POST">

<input
type="text"
name="name"
placeholder="Your Name"
required>

<input
type="email"
name="email"
placeholder="Your Email"
required>

<input
type="text"
name="business"
placeholder="Business Name">

<select name="website-type" required>
<option value="">Website Type</option>
<option>Salon Website</option>
<option>Restaurant Website</option>
<option>Gym Website</option>
<option>Real Estate Website</option>
<option>Portfolio Website</option>
<option>Business Website</option>

</select>

<select name="style" required>
<option value="">Design Style</option>
<option>Minimal</option>
<option>Modern</option>
<option>Luxury</option>
<option>Dark</option>
<option>Nothing OS Style</option>
</select>

<select name="budget">
<option value="">Budget</option>
<option>₹999 - ₹2499</option>

<textarea
name="requirements"
placeholder="Describe your project..."

<button type="submit" class="primary-btn">
Request Project
</button>

</form>
