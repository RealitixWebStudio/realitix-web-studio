<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Start Project | Realitix</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="glass">

<div class="logo">
REALITIX
</div>

<nav>
<a href="index.html">Home</a>
<a href="portfolio.html">Portfolio</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<p class="small-text">
START PROJECT
</p>

<h1>
Let's Build<br>
Something Great
</h1>

<p class="hero-description">
Tell us about your website and we'll get in touch.
</p>

<form
action="https://formsubmit.co/rrealitix@gmail.com"
method="POST">

<input
type="text"
name="name"
placeholder="Your Name"
required>

<input
type="email"
name="email"
placeholder="Your Email"
required>

<input
type="text"
name="business"
placeholder="Business Name">

<select name="type">

<option>Website Type</option>
<option>Business Website</option>
<option>Salon Website</option>
<option>Restaurant Website</option>
<option>Gym Website</option>
<option>Portfolio Website</option>

</select>

<textarea
name="requirements"
placeholder="Tell us about your project">
</textarea>

<button
type="submit"
class="primary-btn">
Request Project
</button>

</form>

</div>

</section>

</body>
</html>
